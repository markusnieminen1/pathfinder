<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Pathfinder Visualizer</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="hud">
    <div class="turn-counter">
        Turn <span id="currentTurn">0</span> / <span id="totalTurns">0</span>
    </div>
    <div id="statusBadge" class="status-badge">Paused</div>
</div>

<div id="controls-hint">
    <kbd>←</kbd> <kbd>→</kbd> Step Turn &nbsp;|&nbsp; <kbd>Space</kbd> Play / Pause &nbsp;|&nbsp; <kbd>R</kbd> Reset
</div>

<svg viewBox="{{.ViewBox}}" preserveAspectRatio="xMidYMid meet">
    <!-- Station Edge Connections -->
    {{range .Graph}}
    {{$station := .}}
    {{range .Connections}}
    <line x1="{{index $station.Coordinates 0}}" y1="{{index $station.Coordinates 1}}"
          x2="{{index .Coordinates 0}}" y2="{{index .Coordinates 1}}" class="grid-line" />
    {{end}}
    {{end}}

    <!-- Highlight Path Lines -->
    {{$PreviousX := index .Start.Coordinates 0}}
    {{$PreviousY := index .Start.Coordinates 1}}
    {{if .Fastest_route_ids}}
    {{range .Fastest_route_ids}}
    <line x1="{{index .Coordinates 0}}" y1="{{index .Coordinates 1}}" x2="{{$PreviousX}}" y2="{{$PreviousY}}" class="fastest-route-line" />
    {{$PreviousX = index .Coordinates 0}}
    {{$PreviousY = index .Coordinates 1}}
    {{end}}
    {{end}}

    <!-- Base Station Nodes & Names -->
    {{range .Graph}}
    <circle cx="{{index .Coordinates 0}}" cy="{{index .Coordinates 1}}" r="0.25" class="station-node" id="node-{{.Name}}" />
    <text x="{{index .Coordinates 0}}" y="{{index .Coordinates 1}}" dx="0.35" dy="0.1" class="station-text">{{.Name}}</text>
    {{end}}

    <!-- Start Station -->
    <circle cx="{{index .Start.Coordinates 0}}" cy="{{index .Start.Coordinates 1}}" r="0.2" class="start-node" />

    <!-- End Station -->
    <circle cx="{{index .End.Coordinates 0}}" cy="{{index .End.Coordinates 1}}" r="0.2" class="end-node" />

    <!-- Dynamic Active Train Layer -->
    <g id="trainsLayer"></g>
</svg>

<script>
    const turnsData = {{.TurnsJSON}} || [];
    const stationsMap = {{.StationsJSON}} || {};

    let currentTurnIdx = 0;
    let isPlaying = false;
    let playTimer = null;

    const currentTurnElem = document.getElementById("currentTurn");
    const totalTurnsElem = document.getElementById("totalTurns");
    const statusBadge = document.getElementById("statusBadge");
    const trainsLayer = document.getElementById("trainsLayer");

    totalTurnsElem.innerText = turnsData.length;

    function updateHUD() {
        currentTurnElem.innerText = currentTurnIdx;
        if (isPlaying) {
            statusBadge.innerText = "Playing";
            statusBadge.classList.add("playing");
        } else {
            statusBadge.innerText = "Paused";
            statusBadge.classList.remove("playing");
        }
    }

    function renderTurn(turnIndex) {
        trainsLayer.innerHTML = "";

        if (turnIndex <= 0 || turnIndex > turnsData.length) {
            updateHUD();
            return;
        }

        const turnMoves = turnsData[turnIndex - 1];

        turnMoves.forEach(move => {
            const parts = move.split("-");
            if (parts.length < 2) return;

            const trainID = parts[0];
            const stationName = parts[1];
            const coords = stationsMap[stationName];

            if (!coords) return;

            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "train-marker");

            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", coords[0]);
            circle.setAttribute("cy", coords[1]);
            circle.setAttribute("r", "0.3");

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", coords[0]);
            text.setAttribute("y", coords[1]);
            text.textContent = trainID;

            g.appendChild(circle);
            g.appendChild(text);
            trainsLayer.appendChild(g);
        });

        updateHUD();
    }

    function nextTurn() {
        if (currentTurnIdx < turnsData.length) {
            currentTurnIdx++;
            renderTurn(currentTurnIdx);
        } else if (isPlaying) {
            togglePlay();
        }
    }

    function prevTurn() {
        if (currentTurnIdx > 0) {
            currentTurnIdx--;
            renderTurn(currentTurnIdx);
        }
    }

    function resetTurns() {
        if (isPlaying) togglePlay();
        currentTurnIdx = 0;
        renderTurn(currentTurnIdx);
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        if (isPlaying) {
            if (currentTurnIdx >= turnsData.length) currentTurnIdx = 0;
            playTimer = setInterval(nextTurn, 800);
        } else {
            clearInterval(playTimer);
        }
        updateHUD();
    }

    // Keyboard Controls Handler
    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
            if (isPlaying) togglePlay();
            nextTurn();
        } else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
            if (isPlaying) togglePlay();
            prevTurn();
        } else if (e.code === "Space") {
            e.preventDefault();
            togglePlay();
        } else if (e.key === "r" || e.key === "R") {
            resetTurns();
        }
    });

    renderTurn(0);
</script>
</body>

</html>
