<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph</title>
</head>

<script>

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function applyEvent(e) {
        const circle = document.getElementById(e.i);
        // Change the dots 
        if (circle) circle.setAttribute('fill', e.v ? 'Red' : 'MediumPurple');
    }

    async function fetchBatch() {
        const res = await fetch(`/events`);

        if (!res.ok) throw new Error(`Failed to get events: ${res.status}`);

        return res.json();
    }

    async function showResult() {
    const path_lines = document.querySelectorAll(".fastest_route");

    for (const element of path_lines) {
        element.setAttribute('display', 'block');
        await sleep(65);
    }
}

    async function run() {
    let events = [];

    try {
        events = await fetchBatch();
        
        if (!Array.isArray(events)) {
            events = [];
        }

    } catch (fetchError) {
        console.error("Haku epäonnistui, siirrytään suoraan lopputulokseen:", fetchError);
    }

    for (const event of events) {
        applyEvent(event);
        await sleep(5);
    }

    await showResult();
}


    run();

</script>

<body>
    <svg viewBox="{{.ViewBox}}" style="width: 100vw; height: 100vh;">
        {{range .Graph}}
        {{$station := .}}
        <!--Draws connections -->
        {{range .Connections}}
        <line x1="{{index $station.Coordinates 0}}" y1="{{index $station.Coordinates 1}}" x2="{{index .Coordinates 0}}"
            y2="{{index .Coordinates 1}}" stroke="black" stroke-width="0.2" />
        {{end}}
        {{end}}

        <!--Draws fastest route lines, the lines are hidden and only drawn if data is provided.  -->
        <!--Javascript above doesn't crash if there is no items with class "fastest_route". -->
        {{$PreviousX := index .Start.Coordinates 0}}
        {{$PreviousY := index .Start.Coordinates 1}}

        {{if .Fastest_route_ids}}
            {{range .Fastest_route_ids}}
            <line x1="{{index .Coordinates 0}}" y1="{{index .Coordinates 1}}" x2="{{$PreviousX}}" y2="{{$PreviousY}}"
                stroke="LightSeaGreen" stroke-width="0.4" display="none" class="fastest_route" />
            {{$PreviousX = index .Coordinates 0}}
            {{$PreviousY = index .Coordinates 1}}
            {{end}}
        {{end}}

        <!--Draws stations -->
        {{range .Graph}}
        <circle cx="{{index .Coordinates 0}}" cy="{{index .Coordinates 1}}" r="0.2" fill="Lavender" id="{{.ID}}" />
        <text x="{{index .Coordinates 0}}" y="{{index .Coordinates 1}}" font-size="0.3">{{.Name}}</text>
        {{end}}

        <circle cx="{{index .Start.Coordinates 0}}" cy="{{index .Start.Coordinates 1}}" r="0.5" fill="DarkOrange" />
        <text x="{{index .Start.Coordinates 0}}" y="{{index .Start.Coordinates 1}} "font-size="0.3">{{.Start.Name}}</text>

        <circle cx="{{index .End.Coordinates 0}}" cy="{{index .End.Coordinates 1}}" r="0.3" fill="DarkOrange" />
        <text x="{{index .End.Coordinates 0}}" y="{{index .End.Coordinates 1}}" font-size="0.3">{{.End.Name}}</text>
    </svg>
</body>

</html>
